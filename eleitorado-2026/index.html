<figure id="vr-eleitorado" class="vre" aria-labelledby="vre-titulo">
<style>
  #vr-eleitorado {
    --vre-fundo: #ffffff;
    /* Cores do Vila Rica News: preto #171717 e vermelho #ff0032 do logotipo;
       azul e verde das editorias do site (#302ebd clareado 1 tom para passar no teste de daltonismo; #0b8b09) */
    --vre-tinta: #171717;
    --vre-tinta-2: #4d4d4d;
    --vre-tinta-3: #6e6e6e;
    --vre-linha: #e5e5e5;
    --vre-trilho: #f2f2f2;
    --vre-destaque: #ff0032;
    --vre-neutro: #171717;
    --vre-homens: #3b39c9;
    --vre-mulheres: #ff0032;
    --vre-bio: #0b8b09;
    --vre-sem: #8a8a8a;
    color-scheme: light;
    box-sizing: border-box;
    max-width: 680px;
    margin: 0 auto;
    padding: 20px 16px 16px;
    background: var(--vre-fundo);
    color: var(--vre-tinta);
    font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.4;
    text-align: left;
  }
  #vr-eleitorado *, #vr-eleitorado *::before, #vr-eleitorado *::after { box-sizing: inherit; }
  #vr-eleitorado p, #vr-eleitorado h2 { margin: 0; padding: 0; }

  #vr-eleitorado .vre-chapeu { font-size: 14px; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; color: var(--vre-tinta); margin-bottom: 6px; }
  #vr-eleitorado .vre-chapeu::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--vre-destaque); vertical-align: 1px; }
  #vr-eleitorado .vre-titulo { font-size: 24px; font-weight: 900; line-height: 1.15; letter-spacing: -0.01em; }
  #vr-eleitorado .vre-sub { margin-top: 4px; font-size: 14px; color: var(--vre-tinta-2); }

  /* Abas */
  #vr-eleitorado .vre-controles { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  #vr-eleitorado .vre-abas { display: flex; flex: 1; gap: 4px; padding: 3px; border-radius: 10px; background: var(--vre-trilho); }
  #vr-eleitorado .vre-aba {
    position: relative; flex: 1; overflow: hidden;
    appearance: none; border: 0; margin: 0; border-radius: 7px;
    padding: 8px 6px; background: transparent; color: var(--vre-tinta-2);
    font-family: inherit; font-size: 14px; font-weight: 500; line-height: 1.2; cursor: pointer;
  }
  #vr-eleitorado .vre-aba:hover { color: var(--vre-tinta); }
  #vr-eleitorado .vre-aba[aria-pressed="true"] { background: var(--vre-tinta); color: #ffffff; }
  #vr-eleitorado .vre-aba:focus-visible, #vr-eleitorado .vre-rever:focus-visible, #vr-eleitorado summary:focus-visible { outline: 2px solid var(--vre-destaque); outline-offset: 2px; }
  #vr-eleitorado .vre-progresso { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--vre-destaque); }
  #vr-eleitorado .vre-rever {
    appearance: none; border: 0; background: none; margin: 0; padding: 8px 2px;
    color: var(--vre-tinta-2); font-family: inherit; font-size: 14px; font-weight: 500; line-height: 1.2; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  #vr-eleitorado .vre-rever:hover { color: var(--vre-tinta); }
  #vr-eleitorado .vre-rever svg { width: 14px; height: 14px; }

  /* Números — os três painéis ocupam a mesma célula para a altura não pular */
  #vr-eleitorado .vre-paineis { display: grid; margin-top: 20px; min-height: 112px; }
  #vr-eleitorado .vre-painel { grid-area: 1 / 1; opacity: 0; visibility: hidden; transform: translateY(6px); transition: opacity .35s ease, transform .35s ease, visibility 0s .35s; }
  #vr-eleitorado .vre-painel.ativo { opacity: 1; visibility: visible; transform: none; transition: opacity .45s ease .1s, transform .45s ease .1s, visibility 0s; }
  #vr-eleitorado .vre-num { font-size: 56px; font-weight: 900; line-height: 1; letter-spacing: -0.02em; }
  #vr-eleitorado .vre-num-m { font-size: 44px; }
  #vr-eleitorado .vre-rotulo { margin-top: 6px; font-size: 15px; color: var(--vre-tinta-2); }
  #vr-eleitorado .vre-rotulo strong { color: var(--vre-tinta); font-weight: 500; }
  #vr-eleitorado .vre-dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  #vr-eleitorado .vre-chave { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; color: var(--vre-tinta); margin-bottom: 6px; }
  #vr-eleitorado .vre-bolinha { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  #vr-eleitorado .vre-anel { width: 12px; height: 12px; border-radius: 50%; flex: none; border: 2px solid var(--vre-sem); }
  #vr-eleitorado .vre-extra { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--vre-tinta-2); }

  /* Pontos */
  #vr-eleitorado .vre-grade { position: relative; margin-top: 18px; }
  #vr-eleitorado .vre-grade svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
  #vr-eleitorado .vre-ponto {
    fill: var(--vre-neutro); stroke: var(--vre-neutro); stroke-width: 0;
    transform-box: fill-box; transform-origin: center; transform: scale(0); opacity: 1;
    transition: transform .45s cubic-bezier(.34,1.56,.64,1), fill .5s ease, stroke .5s ease, stroke-width .5s ease, opacity .2s ease;
  }
  #vr-eleitorado .vre-ponto.visivel { transform: scale(1); }
  #vr-eleitorado .vre-ponto.homem { fill: var(--vre-homens); stroke: var(--vre-homens); }
  #vr-eleitorado .vre-ponto.mulher { fill: var(--vre-mulheres); stroke: var(--vre-mulheres); }
  #vr-eleitorado .vre-ponto.bio { fill: var(--vre-bio); stroke: var(--vre-bio); }
  #vr-eleitorado .vre-ponto.sembio { fill: var(--vre-fundo); stroke: var(--vre-sem); stroke-width: 2.5px; }
  #vr-eleitorado .vre-ponto.apagado { opacity: .25; }
  #vr-eleitorado .vre-ponto.pulsa { animation: vre-pulsa 1.4s ease-in-out 2; }
  @keyframes vre-pulsa { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }

  #vr-eleitorado .vre-legenda-grade { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--vre-tinta-3); }
  #vr-eleitorado .vre-legenda-grade .vre-bolinha { width: 9px; height: 9px; background: var(--vre-neutro); }

  /* Dica ao passar o mouse */
  #vr-eleitorado .vre-dica {
    position: absolute; z-index: 2; pointer-events: none; opacity: 0;
    padding: 8px 10px; border-radius: 6px; background: var(--vre-tinta); color: #ffffff;
    font-size: 13px; line-height: 1.35; white-space: nowrap;
    transform: translate(-50%, calc(-100% - 12px)); transition: opacity .12s ease;
  }
  #vr-eleitorado .vre-dica.on { opacity: 1; }
  #vr-eleitorado .vre-dica strong { font-weight: 500; }

  /* Rodapé e tabela */
  #vr-eleitorado figcaption { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--vre-linha); font-size: 12.5px; color: var(--vre-tinta-3); }
  #vr-eleitorado .vre-rodape { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  #vr-eleitorado .vre-rodape p { flex: 1; }
  #vr-eleitorado .vre-logo { display: block; flex: none; width: 126px; height: auto; margin-top: 2px; }
  #vr-eleitorado details { margin-top: 8px; }
  #vr-eleitorado summary { cursor: pointer; font-size: 13px; font-weight: 500; color: var(--vre-tinta-2); width: max-content; }
  #vr-eleitorado table { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  #vr-eleitorado th, #vr-eleitorado td { padding: 7px 4px; border-bottom: 1px solid var(--vre-linha); text-align: right; font-weight: 400; }
  #vr-eleitorado th:first-child, #vr-eleitorado td:first-child { text-align: left; }
  #vr-eleitorado thead th { font-size: 12.5px; font-weight: 500; color: var(--vre-tinta-3); }
  #vr-eleitorado tbody th { color: var(--vre-tinta); }
  #vr-eleitorado tr.vre-grupo th { padding-top: 12px; font-weight: 500; color: var(--vre-tinta-2); border-bottom: 0; }

  @media (max-width: 420px) {
    #vr-eleitorado .vre-titulo { font-size: 21px; }
    #vr-eleitorado .vre-num { font-size: 48px; }
    #vr-eleitorado .vre-num-m { font-size: 36px; }
    #vr-eleitorado .vre-controles { flex-wrap: wrap; }
    #vr-eleitorado .vre-rever { order: 2; }
    #vr-eleitorado .vre-rodape { flex-direction: column; gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #vr-eleitorado .vre-ponto, #vr-eleitorado .vre-painel { transition: none !important; animation: none !important; }
  }
</style>

  var N_SEM_BIO = Math.round(D.semBio / POR_PONTO);
  var DURACAO_PASSO = 5200;

  var fmt = new Intl.NumberFormat('pt-BR');
  function pct(v) { return (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%'; }
  var GRUPOS = {
    total:   { nome: 'Eleitorado de Vila Rica', valor: D.total },
    homem:   { nome: 'Homens', valor: D.homens },
    mulher:  { nome: 'Mulheres', valor: D.mulheres },
    bio:     { nome: 'Com biometria', valor: D.bio },
    sembio:  { nome: 'Sem registro de biometria', valor: D.semBio }
  };

  var reduzido = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var svg = raiz.querySelector('.vre-grade svg');
  var dica = raiz.querySelector('.vre-dica');
  var abas = raiz.querySelectorAll('.vre-aba');
  var paineis = raiz.querySelectorAll('.vre-painel');
  var NS = 'http://www.w3.org/2000/svg';
  var PASSO_GRADE = 24, RAIO = 8;
  var colunas = 20, linhas = 7;
  var pontos = [];
  var passoAtual = 0;

  for (var i = 0; i < N; i++) {
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('class', 'vre-ponto');
    c.setAttribute('r', RAIO);
    svg.appendChild(c);
    pontos.push(c);
  }

  // Ordem por coluna: homens enchem a esquerda, mulheres a direita,
  // e os sem biometria ficam juntos no fim.
  function posicionar() {
    var largura = raiz.clientWidth;
    colunas = largura < 500 ? 14 : 20;
    linhas = Math.ceil(N / colunas);
    svg.setAttribute('viewBox', '0 0 ' + (colunas * PASSO_GRADE) + ' ' + (linhas * PASSO_GRADE));
    pontos.forEach(function (p, i) {
      var col = Math.floor(i / linhas), lin = i % linhas;
      p.setAttribute('cx', col * PASSO_GRADE + PASSO_GRADE / 2);
      p.setAttribute('cy', lin * PASSO_GRADE + PASSO_GRADE / 2);
      p.dataset.col = col;
    });
  }

  function grupoDoPonto(i, passo) {
    if (passo === 1) return i < N_HOMENS ? 'homem' : 'mulher';
    if (passo === 2) return i >= N - N_SEM_BIO ? 'sembio' : 'bio';
    return 'total';
  }

  function contar(el, animar) {
    var alvo = parseFloat(el.dataset.conta);
    var casas = parseInt(el.dataset.casas || '0', 10);
    var sufixo = el.dataset.sufixo || '';
    var opcoes = { minimumFractionDigits: casas, maximumFractionDigits: casas };
    if (!animar || reduzido) { el.textContent = alvo.toLocaleString('pt-BR', opcoes) + sufixo; return; }
    var inicio = null, dur = 1100;
    function quadro(t) {
      if (!inicio) inicio = t;
      var k = Math.min(1, (t - inicio) / dur);
      var e = 1 - Math.pow(1 - k, 3);
      var v = alvo * e;
      v = casas ? Math.round(v * 10) / 10 : Math.round(v);
      el.textContent = v.toLocaleString('pt-BR', opcoes) + sufixo;
      if (k < 1) requestAnimationFrame(quadro);
    }
    requestAnimationFrame(quadro);
  }

  function irPara(passo, animar) {
    passoAtual = passo;
    abas.forEach(function (a, i) { a.setAttribute('aria-pressed', i === passo ? 'true' : 'false'); });
    paineis.forEach(function (p, i) {
      var ativo = i === passo;
      p.classList.toggle('ativo', ativo);
      if (ativo) p.querySelectorAll('[data-conta]').forEach(function (el) { contar(el, animar); });
    });
    pontos.forEach(function (p, i) {
      var g = grupoDoPonto(i, passo);
      var atraso = animar && !reduzido ? (+p.dataset.col * 28 + (i % linhas) * 6) : 0;
      p.style.transitionDelay = atraso + 'ms';
      p.classList.add('visivel');
      p.classList.remove('homem', 'mulher', 'bio', 'sembio', 'pulsa', 'apagado');
      if (g !== 'total') p.classList.add(g);
    });
    if (passo === 2 && animar && !reduzido) {
      setTimeout(function () {
        pontos.slice(N - N_SEM_BIO).forEach(function (p) { p.style.transitionDelay = '0ms'; p.classList.add('pulsa'); });
      }, 900);
    }
  }

  function esconderPontos() {
    pontos.forEach(function (p) { p.style.transitionDelay = '0ms'; p.classList.remove('visivel'); });
  }

  // Reprodução automática: uma vez, ao aparecer na tela; para no último passo
  var timer = null, rodando = false;
  function zerarProgresso() {
    raiz.querySelectorAll('.vre-progresso').forEach(function (b) { b.style.transition = 'none'; b.style.width = '0'; });
  }
  function progresso(passo) {
    zerarProgresso();
    var barra = abas[passo].querySelector('.vre-progresso');
    void barra.offsetWidth;
    barra.style.transition = 'width ' + DURACAO_PASSO + 'ms linear';
    barra.style.width = '100%';
  }
  function parar() { rodando = false; clearTimeout(timer); zerarProgresso(); }
  function tocar() {
    parar();
    rodando = true;
    esconderPontos();
    var passo = 0;
    function proximo() {
      if (!rodando) return;
      irPara(passo, true);
      if (passo < abas.length - 1) {
        progresso(passo);
        timer = setTimeout(function () { passo++; proximo(); }, DURACAO_PASSO);
      } else {
        rodando = false;
        zerarProgresso();
      }
    }
    // pequeno respiro para os pontos sumirem antes de reaparecer
    timer = setTimeout(proximo, 120);
  }

  abas.forEach(function (a) {
    a.addEventListener('click', function () { parar(); irPara(+a.dataset.passo, true); });
  });
  raiz.querySelector('.vre-rever').addEventListener('click', function () { reduzido ? irPara(0, false) : tocar(); });

  // Dica: acha a célula mais próxima do ponteiro (cobre os vãos entre pontos)
  function mostrarDica(ev) {
    var r = svg.getBoundingClientRect();
    var escala = r.width / (colunas * PASSO_GRADE);
    var col = Math.floor((ev.clientX - r.left) / (PASSO_GRADE * escala));
    var lin = Math.floor((ev.clientY - r.top) / (PASSO_GRADE * escala));
    var i = col * linhas + lin;
    if (col < 0 || col >= colunas || lin < 0 || lin >= linhas || i >= N) { esconderDica(); return; }
    var g = grupoDoPonto(i, passoAtual);
    var info = GRUPOS[g];
    dica.innerHTML = '<strong>' + info.nome + '</strong><br>' + fmt.format(info.valor) + ' eleitores · ' + pct(info.valor / D.total);
    var base = raiz.querySelector('.vre-grade').getBoundingClientRect();
    var cx = (col + 0.5) * PASSO_GRADE * escala + (r.left - base.left);
    var cy = lin * PASSO_GRADE * escala + (r.top - base.top);
    var meia = dica.offsetWidth / 2;
    cx = Math.max(meia, Math.min(base.width - meia, cx));
    dica.style.left = cx + 'px';
    dica.style.top = cy + 'px';
    dica.classList.add('on');
    if (passoAtual > 0) {
      pontos.forEach(function (p, k) { p.style.transitionDelay = '0ms'; p.classList.toggle('apagado', grupoDoPonto(k, passoAtual) !== g); });
    }
  }
  function esconderDica() {
    dica.classList.remove('on');
    pontos.forEach(function (p) { p.classList.remove('apagado'); });
  }
  svg.addEventListener('pointermove', mostrarDica);
  svg.addEventListener('pointerdown', mostrarDica);
  // No toque, a dica fica até o próximo toque fora dos pontos
  svg.addEventListener('pointerleave', function (ev) { if (ev.pointerType !== 'touch') esconderDica(); });
  document.addEventListener('pointerdown', function (ev) { if (!svg.contains(ev.target)) esconderDica(); });

  posicionar();
  var larguraAnterior = raiz.clientWidth;
  window.addEventListener('resize', function () {
    if (raiz.clientWidth === larguraAnterior) return;
    larguraAnterior = raiz.clientWidth;
    posicionar();
  });

  // Quando embutido por iframe, avisa a página da altura certa
  function avisarAltura() {
    if (window.parent === window) return;
    window.parent.postMessage({ tipo: 'vr-eleitorado-altura', altura: Math.ceil(document.documentElement.scrollHeight) }, '*');
  }
  if (window.ResizeObserver) new ResizeObserver(avisarAltura).observe(raiz); else window.addEventListener('load', avisarAltura);

  if (reduzido || !('IntersectionObserver' in window)) {
    irPara(0, false);
  } else {
    var obs = new IntersectionObserver(function (entradas) {
      if (entradas[0].isIntersecting) { obs.disconnect(); tocar(); }
    }, { threshold: 0.45 });
    obs.observe(raiz);
  }
})();
</script>
</figure>
<!-- ===== FIM DO GRÁFICO ===== -->

</body>
