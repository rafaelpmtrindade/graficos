<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil do eleitorado de Vila Rica</title>
<meta name="robots" content="noindex, indexifembedded">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../comum/vrn.css">
</head>
<body>
<figure id="vrn"></figure>
<script src="../comum/vrn.js"></script>
<script>
(function () {
  var n = VRN.n, pct = VRN.pct;

  // TSE, Perfil do Eleitorado por Seção 2026 (MT), Vila Rica (código 98990), 16ª Zona
  var D = { total: 13883, homens: 7116, mulheres: 6767, bio: 13405, zona: 16, secoes: 51 };
  D.semBio = D.total - D.bio;

  // 1 ponto = 100 eleitores (arredondado); os grupos de cada aba somam o mesmo total de pontos
  var N = Math.round(D.total / 100);
  var P_HOMENS = Math.round(D.homens / 100), P_BIO = Math.round(D.bio / 100);
  function dica(nome, v) { return '<strong>' + nome + '</strong><br>' + n(v) + ' eleitores · ' + pct(v / D.total); }
  function bolinha(cor) { return '<span class="vrn-bolinha" style="background:var(--vrn-' + cor + ')"></span>'; }
  var LEGENDA = bolinha('tinta') + 'Cada ponto representa cerca de 100 eleitores';
  function casa1(v) { return Math.round(v * 1000) / 10; }

  VRN.grafico({
    id: 'eleitorado-2026',
    chapeu: 'Eleições 2026',
    titulo: 'Perfil do eleitorado',
    subtitulo: 'Vila Rica, cadastro do TSE para 2026',
    passos: [
      {
        aba: 'Total',
        painel:
          '<p class="vrn-chave">' + bolinha('tinta') + 'Total de eleitores</p>' +
          '<p class="vrn-num" data-conta="' + D.total + '">' + n(D.total) + '</p>' +
          '<p class="vrn-rotulo">registrados para 2026</p>' +
          '<p class="vrn-extra">' + D.zona + 'ª Zona Eleitoral · ' + D.secoes + ' seções eleitorais</p>',
        legenda: LEGENDA,
        vis: { tipo: 'pontos', compartilhar: 'eleitorado', colunas: [12, 14, 16, 18, 20, 24, 28, 35],
          grupos: [{ pontos: N, cor: 'var(--vrn-tinta)', dica: dica('Eleitorado de Vila Rica', D.total) }] }
      },
      {
        aba: 'Gênero',
        painel:
          '<div class="vrn-dupla"><div>' +
            '<p class="vrn-chave">' + bolinha('azul') + 'Homens</p>' +
            '<p class="vrn-num vrn-num-m" data-conta="' + casa1(D.homens / D.total) + '" data-casas="1" data-sufixo="%">' + pct(D.homens / D.total) + '</p>' +
            '<p class="vrn-rotulo"><strong>' + n(D.homens) + '</strong> eleitores</p></div><div>' +
            '<p class="vrn-chave">' + bolinha('vermelho') + 'Mulheres</p>' +
            '<p class="vrn-num vrn-num-m" data-conta="' + casa1(D.mulheres / D.total) + '" data-casas="1" data-sufixo="%">' + pct(D.mulheres / D.total) + '</p>' +
            '<p class="vrn-rotulo"><strong>' + n(D.mulheres) + '</strong> eleitoras</p></div></div>' +
          '<p class="vrn-extra">' + n(D.homens - D.mulheres) + ' homens a mais no cadastro</p>',
        legenda: LEGENDA,
        vis: { tipo: 'pontos', compartilhar: 'eleitorado',
          grupos: [
            { pontos: P_HOMENS, cor: 'var(--vrn-azul)', dica: dica('Homens', D.homens) },
            { pontos: N - P_HOMENS, cor: 'var(--vrn-vermelho)', dica: dica('Mulheres', D.mulheres) }
          ] }
      },
      {
        aba: 'Biometria',
        painel:
          '<p class="vrn-chave">' + bolinha('verde') + 'Com biometria</p>' +
          '<p class="vrn-num" data-conta="' + casa1(D.bio / D.total) + '" data-casas="1" data-sufixo="%">' + pct(D.bio / D.total) + '</p>' +
          '<p class="vrn-rotulo"><strong>' + n(D.bio) + '</strong> eleitores com biometria registrada</p>' +
          '<p class="vrn-extra"><span class="vrn-anel"></span>' + n(D.semBio) + ' sem registro de biometria no arquivo</p>',
        legenda: LEGENDA,
        vis: { tipo: 'pontos', compartilhar: 'eleitorado',
          grupos: [
            { pontos: P_BIO, cor: 'var(--vrn-verde)', dica: dica('Com biometria', D.bio) },
            { pontos: N - P_BIO, cor: 'var(--vrn-sem)', vazado: true, pulsar: true, dica: dica('Sem registro de biometria', D.semBio) }
          ] }
      }
    ],
    fonte: 'Fonte: TSE, Perfil do Eleitorado por Seção 2026. Gênero conforme informado no cadastro eleitoral.',
    tabela: {
      colunas: ['Recorte', 'Eleitores', '%'],
      grupos: [
        { linhas: [['Total', n(D.total), '100,0']] },
        { titulo: 'Gênero', linhas: [['Homens', n(D.homens), pct(D.homens / D.total).replace('%', '')], ['Mulheres', n(D.mulheres), pct(D.mulheres / D.total).replace('%', '')]] },
        { titulo: 'Biometria', linhas: [['Com registro', n(D.bio), pct(D.bio / D.total).replace('%', '')], ['Sem registro', n(D.semBio), pct(D.semBio / D.total).replace('%', '')]] }
      ]
    }
  });
})();
</script>
</body>
</html>
